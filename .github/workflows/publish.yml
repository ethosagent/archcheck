# Publish to npm.
#
# DELIBERATELY MANUAL. There is no push or tag trigger, so nothing publishes until a maintainer
# runs this workflow by hand and types the version. A release that can happen by accident is a
# release that eventually does.
#
# It also refuses to publish a tree that is not green: `bun run check` runs every gate first,
# and `npm publish` is the last step.
name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to publish. It must match package.json exactly.'
        required: true
        type: string
      dry-run:
        description: 'Pack and verify, but do not publish.'
        required: false
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', registry-url: 'https://registry.npmjs.org' }

      - run: bun install --frozen-lockfile

      - name: the version must match package.json
        run: |
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "package.json says $declared, the workflow was given ${{ inputs.version }}"
            echo "bump package.json first, in its own reviewed commit"
            exit 1
          fi
          echo "version $declared"

      # One step, not one per gate. `package.json`'s `prepublishOnly` already runs
      # `bun run build && bun run check`, and npm runs it on a real `npm publish` — from a
      # laptop too, which is the point: that guard cannot be skipped. This step stays anyway
      # because `prepublishOnly` never fires on a dry run, and this workflow defaults to
      # dry-run: true. Without it, a dry run would verify nothing.
      #
      # So a real publish runs the gates twice, here and inside npm. That is the deliberate
      # price of an unskippable guard. Do NOT "optimise" it away by adding `--ignore-scripts`
      # to the publish step below: that skips `prepublishOnly` and silently removes the
      # guarantee. `scripts/run-checks.sh` reports every failing gate rather than stopping at
      # the first, so the log still names what broke.
      - name: every gate must pass
        run: bun run check
      - run: bun run build

      # `--version` and `--help` touch no compiler API, so this step used to pass against a
      # package that could not do any real work. Two things made that possible, and both are
      # fixed here.
      #
      # `npm install typescript` now resolves to TypeScript 7, the native port, which exposes a
      # different API from a different subpath. archcheck's peer range already says `>=5.4 <7`
      # and it refuses to read a graph at runtime, with a message naming the fix — but npm only
      # warns, so an unpinned install produced an unusable package and a green smoke test.
      #
      # And a smoke test that never reads the graph never exercises the part most likely to be
      # broken by a packaging mistake. So this one runs `init`, then a real check, then imports
      # both subpath exports, which is the only way the `exports` map is tested at all.
      - name: the package must install clean in an empty project, and do real work
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer/src/domain /tmp/consumer/src/service && cd /tmp/consumer
          npm init -y >/dev/null
          npm install --silent "/tmp/archcheck-${{ inputs.version }}.tgz" 'typescript@^5.9'
          cat > tsconfig.json <<'JSON'
          { "compilerOptions": { "target": "ES2022", "module": "NodeNext",
            "moduleResolution": "NodeNext", "strict": true, "noEmit": true, "skipLibCheck": true },
            "include": ["src/**/*.ts"] }
          JSON
          echo 'export const write = (n: number): number => n;' > src/service/write.ts
          printf 'import { write } from "../service/write.js";\nexport const price = (n: number): number => write(n);\n' > src/domain/price.ts

          npx archcheck --version
          npx archcheck --help | head -1

          # init has to READ the graph, which is what the version guard above is about.
          npx archcheck init
          grep -q "mayImport: \['service'\]" architecture.config.ts

          npx archcheck --format json > run.json
          node -e "const r=require('./run.json'); if (r.schemaVersion!==1) { throw new Error('schemaVersion '+r.schemaVersion) }"

          # The `exports` map, from a consumer's side. A wrong subpath is invisible until now.
          npx archcheck emit
          node --input-type=module -e "
            import { archcheckEslintBlocks } from 'archcheck/eslint';
            import { archcheckBiomeOverrides } from 'archcheck/biome';
            const e = archcheckEslintBlocks('generated');
            const b = archcheckBiomeOverrides('generated').overrides;
            if (e.length === 0) throw new Error('archcheck/eslint produced no blocks');
            if (b.length === 0) throw new Error('archcheck/biome produced no overrides');
            console.log('eslint blocks', e.length, '| biome overrides', b.length);
          "

      - name: publish
        if: ${{ inputs.dry-run == false }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
