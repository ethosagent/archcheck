name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.13' }
      - run: bun install --frozen-lockfile

      # The identical scripts `bun run check` fans out, one step each so a failure is
      # named in the CI summary rather than buried in one log.
      - name: typecheck
        run: bash scripts/check-typecheck.sh
      - name: lint
        run: bash scripts/check-lint.sh
      - name: tests
        run: bash scripts/check-tests.sh
      - name: emit is not stale
        run: bash scripts/check-emit.sh
      - name: selfhost
        run: bash scripts/check-selfhost.sh

      - name: build
        run: bun run build
