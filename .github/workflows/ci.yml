name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.13' }
      - run: bun install --frozen-lockfile

      # The identical scripts `bun run check` fans out, one step each so a failure is
      # named in the CI summary rather than buried in one log.
      - name: typecheck
        run: bash scripts/check-typecheck.sh
      - name: lint
        run: bash scripts/check-lint.sh
      # Before `tests`, not after: dist/ is gitignored, so with build last the published-CLI
      # symlink test in tests/cli.test.ts (AGENTS.md rule 15 — the gates cannot see a packaging
      # bug) had to build dist/ itself, inside its own test timeout. Building here makes dist/
      # present when the tests gate runs, and stops CI doing the same tsc build twice.
      - name: build
        run: bun run build

      - name: tests
        run: bash scripts/check-tests.sh
      - name: emit is not stale
        run: bash scripts/check-emit.sh
      - name: selfhost
        run: bash scripts/check-selfhost.sh
